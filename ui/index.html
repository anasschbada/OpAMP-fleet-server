<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>OpAMP Fleet</title>
    <!--
      No external font CDN: this app must render correctly in an airgapped
      cluster with no outbound internet access, so we use the OS/browser's
      own UI and monospace font stacks (see styles.css) instead of fetching
      IBM Plex from Google Fonts. Vendor the actual font files under
      ui/public/fonts/ and add @font-face rules in styles.css if exact
      visual fidelity to the original design matters more than that
      constraint for your deployment.
    -->
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      Served by cmd/fleet-ui-server in production (see its handleConfigJS),
      not by Vite's dev server -- a 404 here during `npm run dev` is
      expected and harmless (ui/src/api/client.ts falls back to same-origin
      requests when window.__OPAMP_CONFIG__ is absent). Must load before
      main.tsx so the API base URL is set before any fetch call runs.
      `npm run build` logs a warning about this tag needing type="module"
      to be bundled -- also harmless: this is intentionally NOT a module
      and NOT meant to be bundled (it doesn't exist as a file at build
      time), and `dist/index.html` still contains the tag unchanged.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
