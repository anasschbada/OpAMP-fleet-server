# EXAMPLE ONLY -- do not commit the real token to git. The value here must
# be one of the tokens listed in
# deploy/k8s/platform/04-secret-auth-tokens.example.yaml on the server
# side (same bearer token, both directions).
apiVersion: v1
kind: Secret
metadata:
  name: opamp-auth-token
  namespace: <TEAM_NAMESPACE>
type: Opaque
stringData:
  token: "REPLACE-WITH-THE-SAME-TOKEN-THE-SERVER-ACCEPTS"
