# EXAMPLE ONLY -- do not commit the real token to git. The value here must
# be one of the tokens listed in the server's AGENT token pool
# (deploy/k8s/platform/04-secret-agent-tokens.example.yaml) -- never a
# token from its API pool (05-secret-api-tokens.example.yaml). The server
# checks these against two separate lists; see
# internal/config/config.go's field comment for why.
apiVersion: v1
kind: Secret
metadata:
  name: opamp-auth-token
  namespace: <TEAM_NAMESPACE>
type: Opaque
stringData:
  token: "REPLACE-WITH-THE-SAME-TOKEN-THE-SERVER-ACCEPTS"
