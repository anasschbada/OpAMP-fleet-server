# EXAMPLE ONLY -- do not apply this file as-is and do not commit real
# tokens to git.
#
# This token set is for OpenTelemetry Collector agents ONLY (checked by
# opampserver.Handler.onConnecting). It must be a DIFFERENT set of tokens
# than 05-secret-api-tokens.example.yaml: a collector that only needs to
# hold an OpAMP connection must never also be able to authenticate to the
# REST API and push configuration to every other agent in the fleet. See
# internal/config.Config's AgentAuthTokensFile/APIAuthTokensFile field
# comment for the full rationale, and internal/config/config.go's
# validate() which refuses to start if both env vars point at the same
# file.
#
# Generate real tokens yourself, e.g.:
#   openssl rand -base64 32
#
# Then create the Secret directly with kubectl (never checked into git):
#   kubectl create secret generic opamp-server-agent-tokens \
#     --namespace opamp-system \
#     --from-file=tokens.txt=./agent-tokens.txt
#
# tokens.txt format: one bearer token per line, lines starting with '#'
# ignored. List more than one to rotate without downtime: add the new
# token, roll the collector configs to use it, then remove the old line --
# the server picks up file changes automatically (see
# internal/auth.TokenVerifier.StartAutoReload), no restart required.
apiVersion: v1
kind: Secret
metadata:
  name: opamp-server-agent-tokens
  namespace: opamp-system
type: Opaque
stringData:
  tokens.txt: |
    REPLACE-WITH-A-REAL-RANDOM-TOKEN-BEFORE-APPLYING
