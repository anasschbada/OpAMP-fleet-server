# The server's identity. No Role or RoleBinding is attached to it by
# default anywhere in this directory -- it starts with zero Kubernetes API
# permissions. automountServiceAccountToken is disabled outright: unless a
# namespace admin opts this ServiceAccount into cross-check access (see
# deploy/k8s/namespace-onboarding/), the pod has no use for a token at all,
# and not mounting one removes an entire class of credential-theft risk
# (a vulnerability in the server or one of its dependencies cannot exfiltrate
# a Kubernetes API token that was never mounted in the first place).
#
# If you DO enable K8S_CROSSCHECK_ENABLED (see 03-configmap.yaml), flip
# automountServiceAccountToken to true here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opamp-server
  namespace: opamp-system
automountServiceAccountToken: false
