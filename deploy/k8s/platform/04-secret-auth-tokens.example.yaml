# EXAMPLE ONLY -- do not apply this file as-is and do not commit real
# tokens to git.
#
# Generate real tokens yourself, e.g.:
#   openssl rand -base64 32
#
# Then create the Secret directly with kubectl (never checked into git):
#   kubectl create secret generic opamp-server-auth-tokens \
#     --namespace opamp-system \
#     --from-file=tokens.txt=./tokens.txt
#
# tokens.txt format: one bearer token per line, lines starting with '#'
# ignored. Every OTel Collector's opamp extension AND every REST API caller
# (the UI, or a human operator) must present one of these tokens as
# "Authorization: Bearer <token>". List more than one to rotate without
# downtime: add the new token, roll agents/UI to use it, then remove the
# old line -- the server picks up file changes automatically (see
# internal/auth.TokenVerifier.StartAutoReload), no restart required.
apiVersion: v1
kind: Secret
metadata:
  name: opamp-server-auth-tokens
  namespace: opamp-system
type: Opaque
stringData:
  tokens.txt: |
    REPLACE-WITH-A-REAL-RANDOM-TOKEN-BEFORE-APPLYING
