# The UI's identity. Like the server (01-serviceaccount.yaml), it gets no
# Role/RoleBinding anywhere and no mounted token: cmd/fleet-ui-server only
# serves static files, it makes no Kubernetes API calls and needs no
# outbound network access at all (the browser calls the REST API directly,
# see ui/src/api/client.ts) -- there is nothing this ServiceAccount's token
# would ever be used for.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opamp-fleet-ui
  namespace: opamp-system
automountServiceAccountToken: false
