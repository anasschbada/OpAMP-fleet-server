# EXAMPLE / OPTIONAL -- only needed if you terminate TLS inside the server
# process itself (see the commented TLS_CERT_FILE/TLS_KEY_FILE lines in
# 03-configmap.yaml). If a service mesh or ingress already terminates TLS
# for you inside the trusted network boundary, skip this file.
#
# In a secured/airgapped cluster, get this certificate from your
# organization's internal CA -- for example, if cert-manager is already
# installed cluster-wide with a private ClusterIssuer, a Certificate
# resource referencing it will populate a Secret of this same shape
# automatically. This project does not provision a CA or issuer itself.
apiVersion: v1
kind: Secret
metadata:
  name: opamp-server-tls
  namespace: opamp-system
type: kubernetes.io/tls
data:
  tls.crt: "" # base64-encoded certificate
  tls.key: "" # base64-encoded private key
