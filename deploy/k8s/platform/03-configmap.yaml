# Non-secret runtime settings, mapped 1:1 to internal/config.Config.
# Secret values (auth tokens, TLS key) live in Secrets instead -- see
# 04-secret-agent-tokens.example.yaml, 05-secret-api-tokens.example.yaml
# and 06-secret-tls.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opamp-server-config
  namespace: opamp-system
data:
  OPAMP_LISTEN_ADDR: ":4320"
  API_LISTEN_ADDR: ":8080"
  DATA_DIR: "/data"

  # Two SEPARATE token files, mounted from two separate Secrets (see
  # 07-deployment.yaml). A collector's token must never also work against
  # the REST API -- see internal/config.Config's field comment for why.
  AGENT_AUTH_TOKENS_FILE: "/etc/opamp-server/agent-tokens/tokens.txt"
  API_AUTH_TOKENS_FILE: "/etc/opamp-server/api-tokens/tokens.txt"

  # Optional, additive: lets a REST API/UI caller log in with HTTP Basic
  # Auth instead of an API token (never instead of the agent token above).
  # Uncomment both together and add 14-secret-basicauth.example.yaml's
  # volume/volumeMount in 07-deployment.yaml to enable.
  # BASIC_AUTH_USERNAME_FILE: "/etc/opamp-server/basic-auth/username"
  # BASIC_AUTH_PASSWORD_FILE: "/etc/opamp-server/basic-auth/password"

  STALE_AFTER: "30s"
  DISCONNECTED_AFTER: "90s"
  LOG_LEVEL: "info"

  # Leave both TLS_* variables unset here (as they are) to run the pod
  # plaintext behind a service mesh/ingress that already terminates TLS
  # inside a trusted network boundary. To terminate TLS in the server
  # process itself instead, set these to the paths where
  # 06-secret-tls.example.yaml is mounted and add the corresponding
  # volume/volumeMount in 07-deployment.yaml.
  # TLS_CERT_FILE: "/etc/opamp-server/tls/tls.crt"
  # TLS_KEY_FILE: "/etc/opamp-server/tls/tls.key"
