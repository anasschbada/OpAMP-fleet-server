# EXAMPLE ONLY -- do not apply this file as-is and do not commit real
# tokens to git.
#
# This token set is for REST API callers ONLY (the UI, or a human operator
# via curl/scripts) -- checked by internal/api's withAuth middleware. It
# must be a DIFFERENT set of tokens than
# 04-secret-agent-tokens.example.yaml. See that file's comment for why.
#
# Generate real tokens yourself, e.g.:
#   openssl rand -base64 32
#
# Then create the Secret directly with kubectl (never checked into git):
#   kubectl create secret generic opamp-server-api-tokens \
#     --namespace opamp-system \
#     --from-file=tokens.txt=./api-tokens.txt
#
# tokens.txt format: one bearer token per line, lines starting with '#'
# ignored. List more than one to rotate without downtime, same as the
# agent token file.
apiVersion: v1
kind: Secret
metadata:
  name: opamp-server-api-tokens
  namespace: opamp-system
type: Opaque
stringData:
  tokens.txt: |
    REPLACE-WITH-A-REAL-RANDOM-TOKEN-BEFORE-APPLYING
