# EXAMPLE ONLY -- do not apply this file as-is and do not commit real
# credentials to git. Optional: only needed if you want HTTP Basic Auth as
# an additional login method for the REST API/UI, alongside (never instead
# of) the API token pool in 05-secret-api-tokens.example.yaml.
#
# Uncomment BASIC_AUTH_USERNAME_FILE/BASIC_AUTH_PASSWORD_FILE in
# 03-configmap.yaml and the matching volume/volumeMount in
# 07-deployment.yaml to actually enable it -- the server runs fine without
# this Secret at all (basic auth is off by default).
#
# Generate a real password yourself, e.g.:
#   openssl rand -base64 24
#
# Then create the Secret directly with kubectl (never checked into git):
#   kubectl create secret generic opamp-server-basic-auth \
#     --namespace opamp-system \
#     --from-literal=username=admin \
#     --from-file=password=./basic-auth-password.txt
apiVersion: v1
kind: Secret
metadata:
  name: opamp-server-basic-auth
  namespace: opamp-system
type: Opaque
stringData:
  username: admin
  password: REPLACE-WITH-A-REAL-RANDOM-PASSWORD-BEFORE-APPLYING
