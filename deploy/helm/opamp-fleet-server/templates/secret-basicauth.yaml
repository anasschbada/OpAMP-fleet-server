{{- if .Values.auth.basicAuth.enabled -}}
{{- if not .Values.auth.basicAuth.existingSecret -}}
{{- $secretName := include "opamp-fleet-server.basicAuthSecretName" . -}}
{{- $userKey := .Values.auth.basicAuth.existingSecretUsernameKey -}}
{{- $passKey := .Values.auth.basicAuth.existingSecretPasswordKey -}}
{{- $username := .Values.auth.basicAuth.username | default "admin" -}}
{{- $password := .Values.auth.basicAuth.password -}}
{{- if not $password -}}
{{/* Same sticky-random-value pattern as secret-agent-tokens.yaml: reuse
     across upgrades instead of rotating the login password on every
     release. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data $passKey) -}}
{{- $password = index $existing.data $passKey | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $userKey }}: {{ $username | quote }}
  {{ $passKey }}: {{ $password | quote }}
{{- end -}}
{{- end -}}
