{{- if not .Values.auth.apiTokens.existingSecret -}}
{{- if not .Values.auth.apiTokens.tokens -}}
{{- fail "auth.apiTokens: set either existingSecret or a non-empty tokens list" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opamp-fleet-server.apiTokensSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.apiTokens.existingSecretKey }}: |
    {{- range .Values.auth.apiTokens.tokens }}
    {{ . }}
    {{- end }}
{{- end -}}
