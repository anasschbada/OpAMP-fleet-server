{{- if not .Values.auth.apiTokens.existingSecret -}}
{{- $secretName := include "opamp-fleet-server.apiTokensSecretName" . -}}
{{- $key := .Values.auth.apiTokens.existingSecretKey -}}
{{- $tokens := .Values.auth.apiTokens.tokens -}}
{{- if not $tokens -}}
{{/* See secret-agent-tokens.yaml's comment: same sticky-random-value pattern. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data $key) -}}
{{- $tokens = index $existing.data $key | b64dec | splitList "\n" | compact -}}
{{- else -}}
{{- $tokens = list (randAlphaNum 40) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: |
    {{- range $tokens }}
    {{ . }}
    {{- end }}
{{- end -}}
