{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opamp-fleet-server.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.ui.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opamp-fleet-server.ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.servicePort }}
      targetPort: http
{{- end }}
