{{- if .Values.server.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opamp-fleet-server.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.labels" . | nindent 4 }}
# No Role/RoleBinding is ever attached to this ServiceAccount by this
# chart -- see docs/RBAC.md in the source repository.
automountServiceAccountToken: false
{{- end -}}
