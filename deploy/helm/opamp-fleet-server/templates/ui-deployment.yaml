{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opamp-fleet-server.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "opamp-fleet-server.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opamp-fleet-server.ui.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opamp-fleet-server.ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.servicePort }}
          env:
            - name: UI_LISTEN_ADDR
              value: ":{{ .Values.ui.servicePort }}"
            {{- if .Values.ui.apiBaseUrl }}
            - name: API_BASE_URL
              value: {{ .Values.ui.apiBaseUrl | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
{{- end }}
