{{- if and .Values.ui.enabled .Values.ui.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opamp-fleet-server.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opamp-fleet-server.ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.ui.servicePort }}
  # No egress at all: cmd/fleet-ui-server never makes an outbound call
  # (the browser talks to the REST API directly, not this pod).
  egress: []
{{- end }}
