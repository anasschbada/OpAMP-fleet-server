{{- if not .Values.auth.agentTokens.existingSecret -}}
{{- $secretName := include "opamp-fleet-server.agentTokensSecretName" . -}}
{{- $key := .Values.auth.agentTokens.existingSecretKey -}}
{{- $tokens := .Values.auth.agentTokens.tokens -}}
{{- if not $tokens -}}
{{/*
Neither existingSecret nor an explicit token list was given: generate one
random token instead of failing the install. `lookup` checks whether a
Secret from a PREVIOUS release already exists first, and reuses its value
untouched -- generating a fresh token on every `helm upgrade` would
silently break every collector already configured with the old one.
`lookup` returns an empty map when there's no live cluster to query (e.g.
plain `helm template`), which is falsy here and falls through to
generation, so chart linting/rendering in CI still works without a cluster.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data $key) -}}
{{- $tokens = index $existing.data $key | b64dec | splitList "\n" | compact -}}
{{- else -}}
{{- $tokens = list (randAlphaNum 40) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opamp-fleet-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: |
    {{- range $tokens }}
    {{ . }}
    {{- end }}
{{- end -}}
