# Default values for opamp-fleet-server.
#
# Nothing in this chart creates a Role, RoleBinding, ClusterRole, or
# ClusterRoleBinding, ever -- see docs/RBAC.md in the source repository.
# The optional namespace-onboarding pattern described there is deliberately
# NOT templated here: it's meant to be applied by other teams in their own
# namespaces, independent of installing this chart.

nameOverride: ""
fullnameOverride: ""

server:
  image:
    repository: REPLACE-WITH-YOUR-REGISTRY/opamp-fleet-server
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  # SQLite is single-writer: keep this at 1 (see README.md's scale-out
  # note). The Deployment's update strategy is fixed to Recreate in the
  # template for the same reason, regardless of this value.
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Maps directly to internal/config.Config.
  opampListenPort: 4320
  apiListenPort: 8080
  staleAfter: "30s"
  disconnectedAfter: "90s"
  logLevel: "info"

  serviceAccount:
    create: true
    name: ""
    # Nothing is ever bound to this ServiceAccount by this chart -- see
    # the top-of-file note. automountServiceAccountToken stays false
    # because there is no use for a token at all.

podAnnotations: {}
podLabels: {}

persistence:
  # The SQLite fleet database (agent registry + config push history).
  # Disabling this loses all history on pod restart -- fine for a
  # throwaway/dev install, not for production.
  enabled: true
  size: 2Gi
  storageClassName: "" # empty = cluster default
  existingClaim: "" # set to reuse a PVC created outside this chart instead

# Two SEPARATE token pools -- a collector must never also be able to
# authenticate to the REST API and push config to every other agent in the
# fleet (see internal/config.Config's AgentAuthTokensFile/APIAuthTokensFile
# field comment in the source repo for the full rationale). The chart
# refuses to render if both resolve to the same existingSecret name.
#
# For each pool, in order of precedence:
#   1. existingSecret: point at a Secret you created yourself (kubectl,
#      External Secrets Operator, Sealed Secrets, ...) with a "tokens.txt"
#      key -- the recommended path for anything beyond a quick try-out,
#      since `tokens` below ends up in `helm get values`/your values file
#      in plaintext.
#   2. tokens: a list of strings -- the chart creates the Secret from them.
#   3. Neither set (the default): the chart GENERATES one random 40-char
#      token itself and stores it in a Secret it manages
#      (<release>-agent-tokens / <release>-api-tokens). The generated value
#      is printed by `helm install`/`helm upgrade` in the post-install
#      notes, and stays stable across upgrades (re-used via `lookup`,
#      never rotated silently) -- see secret-agent-tokens.yaml's comment.
#      Retrieve it any time with:
#        kubectl get secret <release>-agent-tokens -n <namespace> -o jsonpath='{.data.tokens\.txt}' | base64 -d
auth:
  agentTokens:
    existingSecret: ""
    existingSecretKey: tokens.txt
    tokens: []
  apiTokens:
    existingSecret: ""
    existingSecretKey: tokens.txt
    tokens: []
  # Optional, additive login method for the REST API/UI: a caller may
  # present either a valid API token above OR this HTTP Basic Auth
  # username/password. Disabled by default (enabled: false). The password
  # follows the exact same existingSecret / explicit value / auto-generated
  # precedence as the token pools above; the username is NOT auto-generated
  # (a random username would be unusable to log in with) -- it defaults to
  # "admin" unless you set one.
  basicAuth:
    enabled: false
    existingSecret: ""
    existingSecretUsernameKey: username
    existingSecretPasswordKey: password
    username: admin
    password: ""

tls:
  # Leave disabled to run plaintext behind a service mesh/ingress that
  # already terminates TLS inside a trusted network boundary (the
  # server-side default). Enabling this terminates TLS in the server
  # process itself; existingSecret must be a kubernetes.io/tls Secret
  # (e.g. one a cert-manager Certificate resource populates).
  enabled: false
  existingSecret: ""

networkPolicy:
  enabled: true
  # Empty selector = ingress allowed from any namespace (the chart's
  # default, matching that collectors/UI-consumers can live anywhere).
  # Tighten by setting matchLabels once you've labeled the namespaces that
  # should be allowed to reach this Service.
  allowedNamespaceSelector: {}

ui:
  enabled: true
  image:
    repository: REPLACE-WITH-YOUR-REGISTRY/opamp-fleet-ui
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  servicePort: 8081
  # Only needed if the REST API is served from a different origin than
  # this UI (separate hostnames rather than one ingress with path-based
  # routing to each Service).
  apiBaseUrl: ""
  serviceAccount:
    create: true
    name: ""
  networkPolicy:
    enabled: true

# Arbitrary extra manifests rendered as part of this release -- e.g. an
# Ingress/IngressRoute in front of the server/UI Services (this chart
# deliberately doesn't template one, see README.md), a PrometheusRule, or
# anything else specific to your cluster. Each entry is passed through
# `tpl`, so it can use chart values/helpers just like the chart's own
# templates, e.g.:
#
# extraManifests:
#   - apiVersion: networking.k8s.io/v1
#     kind: Ingress
#     metadata:
#       name: '{{ include "opamp-fleet-server.fullname" . }}'
#       annotations:
#         nginx.ingress.kubernetes.io/rewrite-target: /
#     spec:
#       rules:
#         - host: opamp.example.com
#           http:
#             paths:
#               - path: /api
#                 pathType: Prefix
#                 backend:
#                   service:
#                     name: '{{ include "opamp-fleet-server.fullname" . }}'
#                     port: { number: 8080 }
#               - path: /
#                 pathType: Prefix
#                 backend:
#                   service:
#                     name: '{{ include "opamp-fleet-server.ui.fullname" . }}'
#                     port: { number: 8081 }
extraManifests: []
